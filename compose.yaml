services:
  postgres:
    image: 'postgres:16-alpine'
    container_name: portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal_db
      POSTGRES_USER: portal_user
      POSTGRES_PASSWORD: portal_secret
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal_user -d portal_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka-1:
    image: apache/kafka:3.8.0
    container_name: portal-kafka-1
    restart: unless-stopped
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_KRAFT_CLUSTER_ID: 4L622nShTWWkrFuMm50BAw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka-2:
    image: apache/kafka:3.8.0
    container_name: portal-kafka-2
    restart: unless-stopped
    ports:
      - '9094:9092'
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_KRAFT_CLUSTER_ID: 4L622nShTWWkrFuMm50BAw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_2_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka-3:
    image: apache/kafka:3.8.0
    container_name: portal-kafka-3
    restart: unless-stopped
    ports:
      - '9095:9092'
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_KRAFT_CLUSTER_ID: 4L622nShTWWkrFuMm50BAw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_3_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: portal-kafka-init
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      echo 'Waiting for Kafka cluster and creating topics with replication factor 3...'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic employee-events --partitions 3 --replication-factor 3
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic attendance-events --partitions 3 --replication-factor 3
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic schedule-events --partitions 3 --replication-factor 3
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic notification-events --partitions 3 --replication-factor 3
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic file-events --partitions 3 --replication-factor 3

      echo 'Kafka topics configured:'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --list
      "

  discovery-service:
    build:
      context: .
      args:
        MODULE: discovery-service
    container_name: portal-discovery
    restart: unless-stopped
    ports:
      - '8761:8761'
    environment:
      SERVER_PORT: 8761
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/eureka/apps"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 600s

  config-service:
    build:
      context: .
      args:
        MODULE: config-service
    container_name: portal-config
    restart: unless-stopped
    ports:
      - '8888:8888'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8888/attendance-service/default"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 600s
    environment:
      SERVER_PORT: 8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    depends_on:
      discovery-service:
        condition: service_healthy

  gateway-service:
    build:
      context: .
      args:
        MODULE: gateway-service
    container_name: portal-gateway
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy

  employee-service:
    build:
      context: .
      args:
        MODULE: employee-service
    container_name: portal-employee-service
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/portal_db
      DB_USER: portal_user
      DB_PASSWORD: portal_secret
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  attendance-service:
    build:
      context: .
      args:
        MODULE: attendance-service
    container_name: portal-attendance-service
    restart: unless-stopped
    ports:
      - '8082:8082'
    environment:
      SERVER_PORT: 8082
      R2DBC_URL: r2dbc:postgresql://postgres:5432/portal_db
      DB_USER: portal_user
      DB_PASSWORD: portal_secret
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  schedule-service:
    build:
      context: .
      args:
        MODULE: schedule-service
    container_name: portal-schedule-service
    restart: unless-stopped
    ports:
      - '8083:8083'
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/portal_db
      DB_USER: portal_user
      DB_PASSWORD: portal_secret
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  notification-service:
    build:
      context: .
      args:
        MODULE: notification-service
    container_name: portal-notification-service
    restart: unless-stopped
    ports:
      - '8084:8084'
    environment:
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/portal_db
      DB_USER: portal_user
      DB_PASSWORD: portal_secret
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  file-service:
    build:
      context: .
      args:
        MODULE: file-service
    container_name: portal-file-service
    restart: unless-stopped
    ports:
      - '8085:8085'
    volumes:
      - file_uploads:/app/uploads
    environment:
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/portal_db
      DB_USER: portal_user
      DB_PASSWORD: portal_secret
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      FILE_STORAGE_PATH: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
  file_uploads:
