server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    bus:
      enabled: true
      destination: springCloudBus
    gateway:
      server:
        webmvc:
          routes:
            - id: employee-service-route
              uri: lb://employee-service
              predicates:
                - Path=/api/companies/**,/api/branches/**,/api/positions/**,/api/employees/**,/api/users/**,/api/auth/**
            - id: attendance-service-route
              uri: lb://attendance-service
              predicates:
                - Path=/api/attendance/**
            - id: schedule-service-route
              uri: lb://schedule-service
              predicates:
                - Path=/api/schedules/**,/api/shifts/**,/api/absences/**,/api/requests/**
            - id: notification-service-route
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**
            - id: file-service-route
              uri: lb://file-service
              predicates:
                - Path=/api/files/**
            - id: employee-docs
              uri: lb://employee-service
              predicates:
                - Path=/v3/api-docs/employee-service
              filters:
                - SetPath=/v3/api-docs
            - id: attendance-docs
              uri: lb://attendance-service
              predicates:
                - Path=/v3/api-docs/attendance-service
              filters:
                - SetPath=/v3/api-docs
            - id: schedule-docs
              uri: lb://schedule-service
              predicates:
                - Path=/v3/api-docs/schedule-service
              filters:
                - SetPath=/v3/api-docs
            - id: notification-docs
              uri: lb://notification-service
              predicates:
                - Path=/v3/api-docs/notification-service
              filters:
                - SetPath=/v3/api-docs
            - id: file-docs
              uri: lb://file-service
              predicates:
                - Path=/v3/api-docs/file-service
              filters:
                - SetPath=/v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,busrefresh,beans,env

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Employee Service
        url: /v3/api-docs/employee-service
      - name: Attendance Service
        url: /v3/api-docs/attendance-service
      - name: Schedule Service
        url: /v3/api-docs/schedule-service
      - name: Notification Service
        url: /v3/api-docs/notification-service
      - name: File Service
        url: /v3/api-docs/file-service
