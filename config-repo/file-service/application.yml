server:
  port: 8085

spring:
  application:
    name: file-service

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portal_db}
    username: ${DB_USER:portal_user}
    password: ${DB_PASSWORD:portal_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    table: flyway_file_history
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9095}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all

  cloud:
    bus:
      enabled: true
      destination: springCloudBus

file:
  storage:
    type: ${FILE_STORAGE_TYPE:s3}
    path: ${FILE_STORAGE_PATH:/app/uploads}
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      access-key: ${S3_ACCESS_KEY:minio_admin}
      secret-key: ${S3_SECRET_KEY:minio_secret}
      bucket: ${S3_BUCKET:portal-files}
      region: ${S3_REGION:us-east-1}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,busrefresh,beans,env

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:v9y$B&E)H@McQfTjWnZr4u7x!A%C*F-JaNdRgUkXp2s5v8y/B?E(G+KbPeShVmYq}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

portal:
  config:
    message: "File Service Dynamic Config v1.0"
